name: Azure Static Web Apps CI/CD (OIDC)

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: token
        run: |
          T=$(az staticwebapp secrets list -n Staycations -g Staycations --query "properties.apiKey" -o tsv)
          echo "::add-mask::$T"
          echo "Token length: ${#T}"
          [ -n "$T" ] || { echo "Empty deployment token" >&2; exit 1; }
          echo "value=$T" >> "$GITHUB_OUTPUT"

      # The Staycations app only accepts deploys signed with GitHub's own
      # identity token, so send that instead of a deployment key.
      - name: Get GitHub identity token
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: token
        run: |
          T=$(az staticwebapp secrets list -n Staycations -g Staycations --query "properties.apiKey" -o tsv)
          echo "::add-mask::$T"
          echo "value=$T" >> "$GITHUB_OUTPUT"

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: "close"
